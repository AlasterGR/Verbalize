#  Builds the solution, runs the tests and publishes the app on every push and pull request.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

#  Cancel an older run on the same branch when a newer push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  #  Build everything and run the unit tests on Linux, which is quick and cheap.
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Verbalize.sln
      - name: Build
        run: dotnet build Verbalize.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test Verbalize.Core.Tests --no-build --configuration Release --logger "console;verbosity=normal"

  #  Publish the app on real Windows and keep the .exe as a download.
  publish-windows:
    name: Publish Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Publish
        run: dotnet publish 2022TextToSpeech/2022TextToSpeech.csproj --configuration Release --runtime win-x64 --self-contained false --output publish
      - uses: actions/upload-artifact@v7
        with:
          name: Verbalize-win-x64
          path: publish/
          if-no-files-found: error
